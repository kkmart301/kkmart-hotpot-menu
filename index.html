<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>江記 KK MART · 精選打邊爐食材點心紙</title>
  <style>:root{
      --forest:#234232; --forest-dark:#162B20; --red:#B8291E; --red-dark:#8F1B12;
      --gold:#B08946; --gold-light:#EFE1C6; --olive:#6C7D47; --amber:#F0A32F;
      --page:#FDFCF4; --ink:#1F2622; --muted:#5F6962; --border:#D8D1C1;
      --rowline:#E9DDC6; --sub:#F1EBDC; --sug:#FAF1DE; --box:#C6B295;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth}
    body{
      margin:0;background-color:var(--page);color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;
      padding-bottom:calc(94px + var(--safe-bottom));overflow-x:hidden;touch-action:manipulation;
      background-image:radial-gradient(rgba(35,66,50,.035) 1px,transparent 1px);
      background-size:22px 22px;
    }
    .page-frame{max-width:920px;margin:8px auto;background:var(--page);
      border:2px solid var(--forest);padding:4px;box-shadow:0 8px 26px rgba(35,66,50,.10)}
    @media(max-width:600px){.page-frame{margin:4px;border-width:1.5px;padding:3px}}
    .page-inner{border:1px solid var(--forest);padding:clamp(10px,2.6vw,18px);position:relative;overflow:hidden}

    /* masthead — same stack as the printed sheet */
    .masthead{text-align:center;padding:6px 2px 8px;background:rgba(248,242,226,.75);
      border-bottom:1px solid var(--gold)}
    .mlogo{width:clamp(46px,12vw,60px);height:auto;display:block;margin:2px auto 4px}
    .mtitle{margin:0;font-family:"Songti TC","Noto Serif TC",serif;font-weight:800;
      font-size:clamp(23px,6.4vw,29px);letter-spacing:.06em;color:var(--ink)}
    .mstrap{margin-top:3px;display:block;font-size:clamp(9px,2.4vw,11px);letter-spacing:.14em;color:var(--forest)}
    .mstrap .en{color:var(--gold);letter-spacing:.16em;margin-left:6px}
    .mhot{margin-top:5px;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
    .mhot .sns{display:inline}
    @media(max-width:420px){.mhot .sep{display:none}.mhot .sns{display:block;margin-top:2px}}
    .mhot b{font-family:"Songti TC",serif;font-size:17px;color:var(--red);letter-spacing:.02em}

    /* fill-in strip */
    .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border:1px solid var(--gold);padding:7px 9px;margin:8px 0 2px;
      background:var(--page);font-size:12.5px}
    .fields label{display:flex;align-items:baseline;gap:5px;min-width:0;color:var(--forest);font-weight:700}
    .fields input{flex:1;width:100%;min-width:0;border:0;border-bottom:1px solid var(--border);
      background:transparent;font-size:12.5px;padding:2px 1px;color:var(--ink);outline:none}

    /* sticky controls */
    .sticky-bar{position:sticky;top:0;z-index:50;background:rgba(253,252,244,.96);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border-bottom:1.5px solid var(--forest);padding:8px;margin:6px -10px 10px}
    .controls-top{display:flex;gap:6px;align-items:center;margin-bottom:8px}
    .search-input{flex:1;min-width:0;height:34px;border:1.2px solid var(--forest);border-radius:8px;
      padding:0 10px;font-size:13px;background:#fff;color:var(--ink);outline:none}
    .cat-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
    .cat-tabs::-webkit-scrollbar{display:none}
    .cat-tab{white-space:nowrap;padding:5px 11px;border-radius:16px;border:1px solid var(--gold);
      background:var(--page);color:var(--forest);font-size:12px;font-weight:700;text-decoration:none}
    .cat-tab.active{background:var(--red);color:#fff;border-color:var(--red)}

    /* category block: one hand-drawn picture + colour zone, as on the sheet */
    .cat-card{position:relative;margin:14px 0;border-radius:7px;overflow:hidden;isolation:isolate;
      opacity:0;transform:translateY(14px);transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1)}
    .cat-card.visible{opacity:1;transform:translateY(0)}
    .cat-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.42;z-index:-2}
    .cat-bg::after{content:"";position:absolute;inset:0;background:var(--tint,transparent);opacity:.18}

    .band{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--forest);
      color:#fff;padding:9px 10px;border-bottom:1px solid var(--gold)}
    .chip{background:var(--red);border-radius:4px;font-size:12px;font-weight:800;padding:2px 7px;font-style:normal}
    .ctitle{font-size:17px;font-weight:800;letter-spacing:.1em}

    .subband{background:var(--sub);color:var(--forest);font-weight:800;font-size:12.5px;
      text-align:center;padding:7px 8px;border-left:3px solid var(--forest);letter-spacing:.04em}

    .items-grid{display:block}
    .item-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto 62px;align-items:center;
      gap:8px;padding:7px 9px;border-bottom:1px solid var(--rowline)}
    .item-row.suggested{background:rgba(250,241,222,.55);box-shadow:inset 2px 0 0 var(--gold)}
    .item-row.selected{background:rgba(184,41,30,.055)}
    .item-code{font-size:10px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
    .item-name{font-size:13.5px;line-height:1.35;color:var(--ink)}
    .badge-sug{font-size:9.5px;font-weight:700;color:var(--gold);margin-left:5px;
      border:1px solid rgba(176,137,70,.55);border-radius:3px;padding:0 3px;vertical-align:1px}
    .item-price{font-size:12.5px;font-weight:700;color:var(--red-dark);text-align:right;white-space:nowrap;line-height:1.15}
    .item-price small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:0}
    .item-price.tbd{color:var(--muted);font-weight:500}
    .item-ctrl{display:flex;align-items:center;gap:6px;justify-content:flex-end}
    .qty-stepper{display:none;align-items:center;border:1px solid var(--forest);border-radius:5px;overflow:hidden;background:var(--page)}
    .qty-stepper.show{display:flex}
    .qty-stepper button{width:24px;height:24px;border:0;background:var(--sub);color:var(--forest);font-size:15px;font-weight:800;line-height:1}
    .qty-val{min-width:20px;text-align:center;font-size:12.5px;font-weight:800}
    .tick-box{width:24px;height:24px;border:1px solid var(--box);border-radius:4px;background:var(--page);
      display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff}
    .tick-box.checked{background:var(--red);border-color:var(--red)}

    @media(max-width:430px){.mstrap .en{display:block;margin-left:0;margin-top:2px}}
    .empty{text-align:center;color:var(--muted);padding:28px 0;font-size:13px}

    .foot{margin-top:16px;background:var(--forest);color:var(--gold-light);text-align:center;
      font-size:11.5px;padding:11px 8px;border-top:2px solid var(--gold);letter-spacing:.04em}

    .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-18px);
      background:rgba(35,66,50,.94);color:var(--gold-light);padding:7px 14px;border-radius:20px;
      border:1px solid var(--gold);font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;
      z-index:150;transition:opacity .25s,transform .25s;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .float-tools{position:fixed;left:12px;bottom:calc(84px + var(--safe-bottom));display:flex;
      flex-direction:column;gap:8px;z-index:70}
    @media(max-width:600px){.float-tools{display:none}}
    .float-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);
      background:rgba(253,252,244,.94);color:var(--forest);font-size:15px;font-weight:800;
      box-shadow:0 3px 10px rgba(0,0,0,.12)}

    .bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--forest);color:#fff;
      border-top:2px solid var(--gold);padding:10px 14px calc(10px + var(--safe-bottom));
      display:flex;align-items:center;justify-content:space-between;gap:10px}
    .total-line{font-size:13.5px;font-weight:800;color:var(--gold-light)}
    .sub-line{font-size:11px;color:rgba(255,255,255,.82);margin-top:2px}
    .order-btn{background:var(--red);color:#fff;border:1px solid var(--gold-light);border-radius:8px;
      padding:10px 15px;font-size:14px;font-weight:800;white-space:nowrap}
    .order-btn:disabled{opacity:.5}

    .modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(20,32,25,0);display:flex;
      align-items:flex-end;justify-content:center;pointer-events:none;transition:background .28s}
    .modal-backdrop.open{background:rgba(20,32,25,.68);pointer-events:auto}
    .modal-sheet{background:var(--page);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
      border-radius:16px 16px 0 0;border-top:3px solid var(--gold);padding:16px 16px calc(18px + var(--safe-bottom));
      transform:translateY(105%);transition:transform .32s cubic-bezier(.22,1,.36,1)}
    .modal-backdrop.open .modal-sheet{transform:translateY(0)}
    .modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
      padding-bottom:8px;border-bottom:1px solid var(--border)}
    .modal-hdr h2{margin:0;font-size:16px;color:var(--forest)}
    .close-btn{background:transparent;border:0;font-size:24px;color:var(--muted);line-height:1}
    .form-group{margin-bottom:11px}
    .form-group label{display:block;font-size:12.5px;font-weight:700;color:var(--forest);margin-bottom:4px}
    .form-control{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}
    .radio-pills{display:flex;gap:6px;flex-wrap:wrap}
    .radio-pill{flex:1;min-width:92px;text-align:center;padding:8px 6px;border:1px solid var(--border);
      border-radius:8px;background:#fff;font-size:12px;font-weight:700}
    .radio-pill.active{background:var(--forest);color:#fff;border-color:var(--forest)}
    .discount-check{display:flex;align-items:center;gap:8px;background:rgba(250,241,222,.7);
      border:1px solid #E8D7B4;padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:700;
      color:var(--red-dark);margin-bottom:10px}
    .cart-preview{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;
      font-size:12.5px;max-height:145px;overflow-y:auto;margin-bottom:10px;line-height:1.55}
    .btn-wa{background:#25D366;color:#fff;border:0;border-radius:10px;padding:13px;font-size:15px;
      font-weight:800;width:100%;margin-bottom:8px}
    .btn-copy{background:#fff;color:var(--forest);border:1.2px solid var(--forest);border-radius:10px;
      padding:10px;font-size:13.5px;font-weight:700;width:100%}
  </style>
</head>
<body>

  <div class="toast" id="toast">已加入點心紙 ✓</div>

  <div class="page-frame">
    <div class="page-inner">

      <header class="masthead">
        <img class="mlogo" src="logo.png" alt="江記 KK MART" />
        <h1 class="mtitle">打邊爐食材點心紙</h1>
        <div class="mstrap">精選食材 · 品質之選 <span class="en">HOT POT ORDERING SHEET</span></div>
        <div class="mhot"><span class="wa">WhatsApp <b>6365 9992</b></span><span class="sep">　</span><span class="sns">Instagram kkmart.hk　·　FaceBook KK mart</span></div>
      </header>

      <div class="fields">
        <label>姓名<input type="text" id="topName" placeholder="陳生"
          oninput="document.getElementById('custName').value=this.value" /></label>
        <label>電話<input type="tel" id="topPhone" placeholder="9123 4567"
          oninput="document.getElementById('custPhone').value=this.value" /></label>
        <label>送貨日期<input type="text" id="topDate" placeholder="今晚 6:30"
          oninput="document.getElementById('custNote').value=this.value" /></label>
      </div>

      <div class="sticky-bar">
        <div class="controls-top">
          <input type="search" id="searchInput" class="search-input" placeholder="搜尋食材（如：吊龍、牛三拼、海中蝦、響鈴）" />
        </div>
        <div class="cat-tabs" id="catTabs"></div>
      </div>

      <main id="menuContainer"></main>

      <footer class="foot">WhatsApp 6365 9992　·　Instagram kkmart.hk　·　FaceBook KK mart</footer>
    </div>
  </div>

  <div class="float-tools">
    <button class="float-btn" title="返回頂部" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</button>
    <button class="float-btn" title="清空重選" onclick="clearCart()">↺</button>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <div class="summary-text">
      <div class="total-line" id="bottomTotal">已選 0 件 ｜ 預計 HK$0</div>
      <div class="sub-line" id="bottomSub">點右側方格即可 Tick；長按 +/- 改份數</div>
    </div>
    <button class="order-btn" id="openOrderBtn" disabled onclick="openModal()">確認下單</button>
  </div>

  <div class="modal-backdrop" id="orderModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet">
      <div class="modal-hdr">
        <h2>核對江記點心紙訂單</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div class="cart-preview" id="cartPreview"></div>

      <label class="discount-check">
        <input type="checkbox" id="firstOrderDiscount" onchange="updateSummary(false)" />
        套用【新客首次落單 / 九龍灣工作室自取 9 折】優惠
      </label>

      <div class="form-group">
        <label>取貨方式</label>
        <div class="radio-pills" id="pickupPills">
          <div class="radio-pill active" onclick="selectPickup(this, '西貢街市P1鋪自取')">西貢門市自取</div>
          <div class="radio-pill" onclick="selectPickup(this, '九龍灣鴻力工作室自取（享9折）')">九龍灣工作室自取</div>
          <div class="radio-pill" onclick="selectPickup(this, '送貨上門')">送貨上門</div>
        </div>
      </div>

      <div class="form-group">
        <label>顧客姓名 / 聯絡電話</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="custName" class="form-control" placeholder="姓名（如：陳生）" />
          <input type="tel" id="custPhone" class="form-control" placeholder="電話（如：9123 4567）" />
        </div>
      </div>

      <div class="form-group">
        <label>取貨時間 / 送貨地址及備註</label>
        <input type="text" id="custNote" class="form-control" placeholder="例：今晚 6:30 取貨，文昌雞要切片" />
      </div>

      <button class="btn-wa" onclick="sendWhatsApp()">一鍵經 WhatsApp 發送訂單 (6365 9992)</button>
      <button class="btn-copy" onclick="copyOrderText()">複製訂單文字（手動貼上）</button>
    </div>
  </div>

    MENU_DATA.forEach(cat => cat.subs.forEach(sub => sub.items.forEach(it => { itemMap[it.code] = it; })));

    function getUnitPrice(it) { return it.price; }

    // only numbers are summed; 時價 / per-jin prices stay 待門市確認
    function isNumericPrice(p) { return typeof p === 'number' && isFinite(p); }
    function priceTag(p) {
      if (p === null || p === undefined) return '待報價';
      if (isNumericPrice(p)) return 'HK$' + p;
      return String(p).charAt(0) === '時' ? '時價' : 'HK$' + p;
    }
    function formatPriceLabel(it) {
      return priceTag(getUnitPrice(it));
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
    }

    function spawnFlyDot(sourceEl) {
      if (!sourceEl) return;
      const rect = sourceEl.getBoundingClientRect();
      const target = document.getElementById("openOrderBtn").getBoundingClientRect();
      const dot = document.createElement("div");
      dot.className = "fly-dot";
      dot.style.left = `${rect.left + rect.width / 2 - 7}px`;
      dot.style.top = `${rect.top + rect.height / 2 - 7}px`;
      document.body.appendChild(dot);
      requestAnimationFrame(() => {
        const dx = (target.left + target.width / 2) - (rect.left + rect.width / 2);
        const dy = (target.top + target.height / 2) - (rect.top + rect.height / 2);
        dot.style.transform = `translate(${dx}px, ${dy}px) scale(0.4)`;
        dot.style.opacity = "0";
      });
      setTimeout(() => dot.remove(), 480);
    }

    function updateRowUI(code) {
      const row = document.querySelector(`.item-row[data-code="${code}"]`);
      if (!row) return;
      const qty = cart[code] || 0;
      const isChecked = qty > 0;
      row.classList.toggle("selected", isChecked);

      const stepper = row.querySelector(".qty-stepper");
      stepper.classList.toggle("show", isChecked);
      stepper.querySelector(".qty-val").textContent = qty;

      const tick = row.querySelector(".tick-box");
      tick.classList.toggle("checked", isChecked);
      tick.textContent = isChecked ? "✓" : "";
    }

    function toggleTick(code, el) {
      if (cart[code] && cart[code] > 0) {
        delete cart[code];
      } else {
        cart[code] = 1;
        spawnFlyDot(el);
        showToast(`已 Tick：${itemMap[code].name}`);
      }
      updateRowUI(code);
      updateSummary(true);
    }

    function changeQty(code, delta, el) {
      const next = (cart[code] || 0) + delta;
      if (next <= 0) delete cart[code];
      else {
        cart[code] = next;
        if (delta > 0) spawnFlyDot(el);
      }
      updateRowUI(code);
      updateSummary(true);
    }

    function clearCart() {
      const keys = Object.keys(cart);
      if (keys.length === 0) return;
      if (confirm("確定要清空目前所選食材重選嗎？")) {
        keys.forEach(k => {
          delete cart[k];
          updateRowUI(k);
        });
        updateSummary(false);
        showToast("已清空點心紙");
      }
    }

    function renderTabs() {
      document.getElementById("catTabs").innerHTML = MENU_DATA.map((c, idx) =>
        `<a class="cat-tab ${idx === 0 ? 'active' : ''}" data-cat="${c.id}" href="#${c.id}" onclick="activateTab(this)">${c.num} ${c.title}</a>`
      ).join("");
    }

    function activateTab(el) {
      document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
    }


    function observeCards() {
      const cards = document.querySelectorAll(".cat-card");
      const tabsEl = document.getElementById("catTabs");
      const revealObs = new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) en.target.classList.add("visible"); });
      }, { threshold: 0.04 });

      const spyObs = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (en.isIntersecting) {
            const tab = document.querySelector(`.cat-tab[data-cat="${en.target.id}"]`);
            if (tab) {
              document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
              tab.classList.add("active");
              tabsEl.scrollTo({
                left: tab.offsetLeft - tabsEl.clientWidth / 2 + tab.clientWidth / 2,
                behavior: "smooth"
              });
            }
          }
        });
      }, { rootMargin: "-25% 0px -65% 0px" });

      cards.forEach(c => { revealObs.observe(c); spyObs.observe(c); });
    }

    function renderMenu() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const container = document.getElementById("menuContainer");
  let html = "";

  MENU_DATA.forEach(cat => {
    const bg = CATEGORY_STYLE[cat.id] || { hero: "", tint: "transparent" };
    let rows = "";
    cat.subs.forEach(sub => {
      const filtered = sub.items.filter(it => !q || it.name.toLowerCase().includes(q) || it.code.includes(q));
      if (filtered.length === 0) return;
      rows += `<div class="subband">${sub.title}</div><div class="items-grid">`;
      filtered.forEach(it => {
        const qty = cart[it.code] || 0;
        const isChecked = qty > 0;
        const p = getUnitPrice(it);
        const rowCls = ["item-row", it.sug ? "suggested" : "", isChecked ? "selected" : ""].filter(Boolean).join(" ");
        rows += `
          <div class="${rowCls}" data-code="${it.code}">
            <span class="item-code">${it.code}</span>
            <span class="item-name" onclick="toggleTick('${it.code}', this.parentElement.querySelector('.tick-box'))">${it.name}${it.sug ? '<i class="badge-sug">建議</i>' : ''}</span>
            <span class="item-price ${p === null ? 'tbd' : ''}">${formatPriceLabel(it)}</span>
            <span class="item-ctrl">
              <span class="qty-stepper ${isChecked ? 'show' : ''}">
                <button type="button" onclick="changeQty('${it.code}', -1, this)">−</button>
                <span class="qty-val">${qty}</span>
                <button type="button" onclick="changeQty('${it.code}', 1, this)">+</button>
              </span>
              <span class="tick-box ${isChecked ? 'checked' : ''}" onclick="toggleTick('${it.code}', this)">${isChecked ? '✓' : ''}</span>
            </span>
          </div>`;
      });
      rows += `</div>`;
    });
    if (!rows) return;
    html += `
        <section class="cat-card visible" id="${cat.id}">
          <div class="cat-bg" style="background-image:url('${bg.hero}');--tint:${bg.tint}"></div>
          <div class="band"><b class="chip">${cat.num}</b><span class="ctitle">${cat.title}</span></div>
          ${rows}
        </section>`;
  });

  container.innerHTML = html || `<p class="empty">找不到符合「${q}」的食材</p>`;
  observeCards();
}

    function updateSummary(animate = true) {
      let totalQty = 0, totalAmt = 0, hasTbd = false;
      Object.entries(cart).forEach(([code, qty]) => {
        totalQty += qty;
        const p = getUnitPrice(itemMap[code]);
        if (isNumericPrice(p)) totalAmt += p * qty; else hasTbd = true;
      });
      const is90 = document.getElementById("firstOrderDiscount").checked;
      const finalAmt = is90 ? Math.round(totalAmt * 0.9 * 10) / 10 : totalAmt;
      const totalEl = document.getElementById("bottomTotal");
      totalEl.textContent = `已選 ${totalQty} 件 ｜ 預計 HK$${finalAmt}${hasTbd ? ' (+待報價)' : ''}`;
      if (animate) {
        totalEl.classList.remove("bump");
        void totalEl.offsetWidth;
        totalEl.classList.add("bump");
      }
      document.getElementById("bottomSub").textContent = totalQty > 0
        ? `計價：零售價${is90 ? ' · 已套 9 折優惠' : ''}`
        : "點擊右側正方形「□」即可直接 Tick 落單";
      document.getElementById("openOrderBtn").disabled = totalQty === 0;
      renderCartPreview(finalAmt, hasTbd, is90);
    }

    function renderCartPreview(finalAmt, hasTbd, is90) {
      const el = document.getElementById("cartPreview");
      const entries = Object.entries(cart);
      if (entries.length === 0) { el.innerHTML = ""; return; }
      const lines = entries.map(([code, qty]) => {
        const it = itemMap[code];
        const p = getUnitPrice(it);
        return `<div>☑ <b>${it.code} ${it.name}</b> × ${qty} 份（${isNumericPrice(p) ? 'HK$' + p * qty : priceTag(p)}）</div>`;
      });
      lines.push(`<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #ccc;color:#B8291E;font-weight:800;">預計合計：HK$${finalAmt}${is90 ? '（已計 9 折）' : ''}${hasTbd ? ' ＋ 待報價品項' : ''}</div>`);
      el.innerHTML = lines.join("");
    }

    function selectPickup(el, val) {
      pickupMethod = val;
      document.querySelectorAll("#pickupPills .radio-pill").forEach(p => p.classList.remove("active"));

        document.getElementById("firstOrderDiscount").checked = true;
        updateSummary(false);

    function buildWhatsAppMessage() {
      const name = document.getElementById("custName").value.trim() || "未填寫";
      const phone = document.getElementById("custPhone").value.trim() || "未填寫";
      const note = document.getElementById("custNote").value.trim() || "無";
      const is90 = document.getElementById("firstOrderDiscount").checked;
      let totalQty = 0, totalAmt = 0, hasTbd = false;
      const itemLines = [];
      Object.entries(cart).forEach(([code, qty]) => {
        const it = itemMap[code];
        const p = getUnitPrice(it);
        totalQty += qty;
        if (isNumericPrice(p)) totalAmt += p * qty; else hasTbd = true;
        itemLines.push(`☑ ${it.code} ${it.name} × ${qty}（${isNumericPrice(p) ? 'HK$' + p * qty : priceTag(p)}）`);
      });
      const finalAmt = is90 ? Math.round(totalAmt * 0.9 * 10) / 10 : totalAmt;
      return [
        "【🍲 江記 KK MART 打邊爐點心紙訂單】",
        `取貨方式：${pickupMethod}`,
        `顧客姓名：${name} ｜ 電話：${phone}`,
        "——————————",
        ...itemLines,
        "——————————",
        `合共份數：${totalQty} 份`,
        `預計金額：HK$${finalAmt}${is90 ? "（已套用 9 折優惠）" : ""}${hasTbd ? "（未含待報價品項）" : ""}`,
        `備註 / 時間：${note}`
      ].join("\n");
    }

      const text = buildWhatsAppMessage();
      navigator.clipboard.writeText(text).then(() => {
        showToast("已複製訂單文字，可貼到 WhatsApp 發送！");
      }).catch(() => prompt("請全選複製以下訂單文字：", text));
    }

    document.getElementById("searchInput").addEventListener("input", renderMenu);
    renderTabs();
    renderMenu();
    updateSummary(false);
  </script>
</body>
</html>
